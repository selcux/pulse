[package]
name = "pulse-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "CLI for syncing and visualising health data from Garmin Connect and Intervals.icu"
keywords = ["health", "garmin", "cli", "fitness", "wearable"]
categories = ["command-line-utilities"]

[dependencies]
pulse-health-core = { path = "../pulse-core", version = "0.14.0" }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
toon-format = { version = "=0.7.0", default-features = false }
rpassword = "7"

[[bin]]
name = "pulse"
path = "src/main.rs"

# `cargo binstall pulse-cli` downloads the binary from the GitHub Release instead of compiling.
# Names match the archives that .github/workflows/release.yml builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "pulse{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
